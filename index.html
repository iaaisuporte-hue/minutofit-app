<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Antes de CSS/paint: modo daltônico vindo do localStorage (mesma chave que ColorModeToggle) -->
    <script>
      (function () {
        try {
          if (localStorage.getItem("corefit_color_mode") === "daltonic") {
            document.documentElement.setAttribute("data-color-mode", "daltonic");
          }
        } catch (_) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/corefit-icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1DB954" />
    <meta name="description" content="S2Core — metabolismo, constância e acompanhamento em um só lugar." />
    <!-- PWA — iOS standalone (Adicionar à Tela de Início) -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="S2Core" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>S2Core</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/1/en_US/appleid.auth.js" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
