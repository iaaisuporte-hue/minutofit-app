<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Antes de CSS/paint: modo daltônico vindo do localStorage (mesma chave que ColorModeToggle) -->
    <script>
      (function () {
        try {
          if (localStorage.getItem("corefit_color_mode") === "daltonic") {
            document.documentElement.setAttribute("data-color-mode", "daltonic");
          }
          var t = localStorage.getItem("corefit_theme");
          if (t === "dark" || t === "light") {
            document.documentElement.setAttribute("data-theme", t);
          }
          // A barra de status do Android/iOS segue a theme-color. Fixa em oliva,
          // ela destoava do app no tema escuro; aqui ela acompanha o tema já na
          // primeira pintura, antes do React montar.
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta && t === "dark") meta.setAttribute("content", "#121212");
        } catch (_) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/corefit-icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#7B9919" />
    <meta name="description" content="S2Core — metabolismo, constância e acompanhamento em um só lugar." />
    <!-- PWA — iOS standalone (Adicionar à Tela de Início) -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- black-translucent deixa o conteúdo subir sob a barra; o app já reserva
         safe-area-inset-top e o fundo é escuro (background_color #121212). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="S2Core" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>S2Core</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/1/en_US/appleid.auth.js" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
