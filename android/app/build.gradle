apply plugin: 'com.android.application'

// Assinatura de release (Play Store). O arquivo keystore.properties é local,
// nunca commitado (contém senha em texto puro) — sem ele, o build de release
// simplesmente sai sem assinar (falha no bundleRelease, com mensagem clara),
// e builds de debug/CI continuam funcionando normalmente.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
def hasKeystoreProperties = keystorePropertiesFile.exists()
if (hasKeystoreProperties) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// AccessKey do Picovoice (P5C — spike técnico de wake word, SEM fornecedor
// definitivo; ver docs/produto/voice_workout_wake_word_decision.md no repo
// pai). Mesmo padrão do keystore acima: arquivo local, nunca commitado:
// sem ele o build compila normalmente e a chave fica vazia — o app detecta
// isso em runtime e cai para push-to-talk, sem erro visível.
def picovoicePropertiesFile = rootProject.file('picovoice.properties')
def picovoiceProperties = new Properties()
if (picovoicePropertiesFile.exists()) {
    picovoiceProperties.load(new FileInputStream(picovoicePropertiesFile))
}
def picovoiceAccessKey = picovoiceProperties.getProperty('PICOVOICE_ACCESS_KEY', '')

// Seletor do motor de wake word (P5C — spike aberto: Porcupine × ONNX estilo
// openWakeWord, nenhum definitivo; ver
// docs/produto/voice_workout_wake_word_spike_onnx.md no repo pai). Mesmo
// padrão dos dois arquivos acima: local, nunca commitado. Sem o arquivo (ou
// com valor vazio/desconhecido) o app compila com o motor padrão
// "porcupine" — comportamento de produção inalterado. Definir
// WAKE_WORD_ENGINE=onnx_spike só em build local para testar o spike.
def wakewordPropertiesFile = rootProject.file('wakeword.properties')
def wakewordProperties = new Properties()
if (wakewordPropertiesFile.exists()) {
    wakewordProperties.load(new FileInputStream(wakewordPropertiesFile))
}
def wakeWordEngine = wakewordProperties.getProperty('WAKE_WORD_ENGINE', 'porcupine')

android {
    namespace "com.s2core.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.s2core.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // versionCode "queima" a cada upload no Play Console, mesmo quando o
        // upload é rejeitado (ex.: compileSdk/targetSdk baixo demais) ou fica
        // parado no meio do assistente sem publicar — os códigos 1 e 3 já
        // foram consumidos assim, nunca chegaram a ser lançados de fato.
        // O workflow de CI (android-internal-release.yml) sobrescreve este valor
        // via `-PversionCode=N` só naquele build — nunca commitar o número aqui
        // a partir do CI. Build local/Android Studio cai no fallback fixo.
        versionCode project.hasProperty('versionCode') ? (project.property('versionCode') as Integer) : 7
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // P5C — compilado no app, nunca no bundle web/JS: o AccessKey só existe
        // do lado nativo, o mesmo isolamento que já vale para o keystore.
        buildConfigField "String", "PICOVOICE_ACCESS_KEY", "\"${picovoiceAccessKey}\""
        buildConfigField "String", "WAKE_WORD_ENGINE", "\"${wakeWordEngine}\""
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasKeystoreProperties) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasKeystoreProperties) {
                signingConfig signingConfigs.release
            }
        }
    }
    buildFeatures {
        // AGP 8 desliga a geração de BuildConfig por padrão — precisa disto
        // para o `buildConfigField` do AccessKey do Picovoice (P5C) existir.
        buildConfig true
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // P5C — spike técnico de wake word (trial de 7 dias, sem fornecedor
    // definitivo; ver docs/produto/voice_workout_wake_word_decision.md no
    // repo pai). Versão travada na mais recente publicada no Maven Central
    // (verificado em set/2026 — nenhuma release desde nov/2023).
    implementation "ai.picovoice:porcupine-android:3.0.1"
    // P5C — spike aberto do motor ONNX estilo openWakeWord (mesma ressalva
    // acima: sem fornecedor definitivo). Versão travada na mais recente
    // publicada no Maven Central (verificado em set/2026).
    implementation "com.microsoft.onnxruntime:onnxruntime-android:1.22.0"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
