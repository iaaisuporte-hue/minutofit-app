ext {
    minSdkVersion = 23
    // 36: exigido por androidx.browser:browser:1.9.0 (trazido pelo
    // @capgo/capacitor-social-login — login nativo Google). targetSdk fica em
    // 35 de propósito: subir compileSdk só habilita compilar contra APIs
    // novas; subir targetSdk também opta nos comportamentos novos do Android
    // 16, e isso merece QA dedicado, não vir de carona aqui.
    compileSdkVersion = 36
    targetSdkVersion = 35
    androidxActivityVersion = '1.9.2'
    androidxAppCompatVersion = '1.7.0'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.15.0'
    androidxFragmentVersion = '1.8.4'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.12.1'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.2.1'
    androidxEspressoCoreVersion = '3.6.1'
    cordovaAndroidVersion = '10.1.1'
}